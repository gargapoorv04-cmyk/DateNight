<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Date night</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8d9dc; --dot:#f0bcc3; --ink:#3a2340; --muted:#7d5f82; --card:#fffdfb; --shadow:rgba(80,30,60,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2a1b30; --dot:#3a2742; --ink:#fbeaf0; --muted:#c3a6c9; --card:#3c2a45; --shadow:rgba(0,0,0,.45); }
}
:root[data-theme="dark"]{ --bg:#2a1b30; --dot:#3a2742; --ink:#fbeaf0; --muted:#c3a6c9; --card:#3c2a45; --shadow:rgba(0,0,0,.45); }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);background-size:22px 22px}
main{max-width:620px;margin:0 auto;padding:44px 20px 72px}
h1{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-size:clamp(3.6rem,15vw,6rem);line-height:.9;margin:0 0 6px;font-weight:700;transform:rotate(-2deg)}
.sub{color:var(--muted);margin:0 0 40px;font-weight:500}
.cards{display:grid;gap:34px}
.card{position:relative;background:var(--card);border-radius:6px;padding:34px 24px 22px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 10px 24px var(--shadow);transition:transform .25s}
.card:nth-child(odd){transform:rotate(-1.2deg)} .card:nth-child(even){transform:rotate(1.2deg)}
.card:hover{transform:rotate(0) translateY(-3px)}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
.card::before{content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;margin-left:-55px;background:var(--tape);opacity:.85;transform:rotate(-3deg);border-radius:2px}
.card h2{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;margin:0;font-size:clamp(2.1rem,7vw,2.8rem);line-height:1;font-weight:700}
.hearts{display:flex;gap:5px;margin-top:12px;font-size:.95rem;color:var(--tape)}
.hearts i{font-style:normal;opacity:.3}.hearts i.on{opacity:1}
.items{list-style:none;margin:0;padding:0}
.items li{margin-top:12px;padding:14px 16px;background:var(--note);color:#3a2340;font-weight:800;line-height:1.35;border-radius:3px;
  box-shadow:0 4px 10px var(--shadow);animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.items li:nth-child(odd){transform:rotate(-.8deg)} .items li:nth-child(even){transform:rotate(.7deg)}
.items li.lead{background:none;box-shadow:none;padding:0 2px;font-family:Caveat,"Segoe Script",cursive;font-size:1.7rem;font-weight:700;color:var(--ink);transform:none}
.timer{display:flex;align-items:center;gap:12px}
.timer span{flex:1}
.timer b{font-size:1.6rem;font-variant-numeric:tabular-nums}
.timer button,.items li a.play{font:inherit;font-weight:800;border:0;border-radius:999px;padding:9px 18px;background:#3a2340;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.reset{margin-top:14px;font:inherit;font-weight:500;font-size:.88rem;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0}
.items li.vinyl{background:none;box-shadow:none;transform:none;text-align:center;padding:6px 0}
.items li.vinyl a{display:inline-block;text-decoration:none;color:var(--ink);font-weight:800}
.disc{width:170px;height:170px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:repeating-radial-gradient(circle,#1b1220 0 2px,#2c1e36 2px 4px);box-shadow:0 8px 18px var(--shadow);animation:spin 5s linear infinite}
.disc b{width:64px;height:64px;border-radius:50%;background:var(--tape);display:grid;place-items:center;color:#3a2340;font-size:1.4rem}
@keyframes spin{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){.disc{animation:none}}
.collage{margin-top:70px}
.collage h2{font-family:Caveat,"Segoe Script",cursive;font-size:clamp(2.8rem,11vw,4rem);margin:0 0 6px;font-weight:700;transform:rotate(-1.5deg)}
.collage p{color:var(--muted);margin:0 0 30px;font-weight:500}
.pol-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:30px 18px}
@media (min-width:560px){.pol-grid{grid-template-columns:repeat(3,1fr)}}
.pol{position:relative;background:var(--card);padding:10px 10px 6px;box-shadow:0 8px 18px var(--shadow);border:0;border-radius:3px;font:inherit;color:var(--ink);text-align:center;transition:transform .25s}
.pol:nth-child(3n+1){transform:rotate(-3deg)}.pol:nth-child(3n+2){transform:rotate(2deg)}.pol:nth-child(3n){transform:rotate(-1deg)}
.pol:hover{transform:rotate(0) scale(1.04)}
.pol:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.pol::before{content:"";position:absolute;top:-10px;left:50%;width:64px;height:20px;margin-left:-32px;background:var(--tp);opacity:.85;transform:rotate(-4deg);border-radius:2px}
.pol .ph{aspect-ratio:4/5;background:var(--dot);display:grid;place-items:center;overflow:hidden;font-size:2.4rem;color:var(--muted)}
.pol img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.pol span.cap{display:block;font-family:Caveat,"Segoe Script",cursive;font-size:1.55rem;line-height:1.3;margin-top:4px}
@media (prefers-reduced-motion:reduce){.pol{transition:none}}
.more{display:block;margin:0 auto 34px;font-family:Caveat,"Segoe Script",cursive;font-size:1.7rem;font-weight:700;border:0;border-radius:999px;padding:8px 26px;background:var(--ink);color:var(--bg);cursor:pointer;box-shadow:0 6px 14px var(--shadow)}
.more:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.pol.new{animation:polin .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes polin{from{opacity:0;scale:.7}to{opacity:1;scale:1}}
@media (prefers-reduced-motion:reduce){.pol.new{animation:none}}
.pol{cursor:pointer}
.pol.covered .ph{background:var(--tp);color:#3a2340}
.pol.covered .ph::after{content:"\2665";font-size:3rem}
.pol.covered img{display:none}
.pol.covered .cap{visibility:hidden}
@keyframes pop{from{opacity:0;margin-top:2px;scale:.92}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.items li{animation:none}.card{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Date night</h1>
  <p class="sub">Tap a card to reveal.</p>
  <div class="cards" id="cards"></div>
  <section class="collage">
    <h2>Us</h2>
        <p>Tap each one to reveal.</p>
    <div class="pol-grid" id="pols"></div>
  </section>
</main>
<script>
var TASKS = [
  {tape:'#ff8fa3', note:'#ffe0e6', title:'Draw each other in 5 mins', items:[{timer:300}]},
  {tape:'#ffd166', note:'#fff1c4', title:'The 30-second scavenger hunt', items:[
    {lead:'Find something in your room that:'},
    {text:'Reminds you of me',timer:60},{text:'Looks like me',timer:60},{text:'You would gift me if you had ₹50',timer:60},
    {text:'You would save during a zombie apocalypse',timer:60},{text:'Represents our relationship',timer:60}]},
  {tape:'#a99bff', note:'#e6e1ff', title:'This or That — impossible edition', items:[
    {lead:'Rapid-fire choices. No “both” or “depends.”'},
    {text:'Hug for 24 hours or kiss for 24 hours?',timer:30},{text:'Read my mind or let me read yours?',timer:30},
    {text:'Our first date again or our first kiss again?',timer:30},{text:'Be stuck in an elevator together or stranded on an island?',timer:30},
    {text:'Give up texting or video calls for a week?',timer:30},
    {text:'Sunrise together or sunset together?',timer:30},{text:'Matching tattoos or matching pyjamas forever?',timer:30}]},
  {tape:'#5fd8bf', note:'#d5f6ee', title:'Don’t you dare laugh', items:[
    {text:'Make the other person laugh in 2 minutes. First to laugh loses.',timer:120}]},
  {tape:'#ff9f68', note:'#ffe2cf', title:'This one’s for you', items:[
    {vinyl:'https://www.youtube.com/watch?v=poYtscS7bto'}]}
];
var root = document.getElementById('cards');
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
TASKS.forEach(function(t){
  var shown = 0;
  var card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--tape', t.tape); card.style.setProperty('--note', t.note);
  card.tabIndex = 0; card.setAttribute('role','button');
  var h = document.createElement('h2'); h.textContent = t.title;
  var hearts = document.createElement('div'); hearts.className = 'hearts';
  t.items.forEach(function(){var i=document.createElement('i');i.textContent='♥';hearts.appendChild(i);});
  var ul = document.createElement('ul'); ul.className = 'items';
  var reset = document.createElement('button'); reset.className='reset'; reset.textContent='Hide again'; reset.hidden = true;
  card.append(h, hearts, ul, reset);
  root.appendChild(card);

  function timerRow(sec, li, text){
    li.className='timer';
    if (text){ var s=document.createElement('span'); s.textContent=text; li.appendChild(s); } else { li.appendChild(document.createElement('span')); }
    var b=document.createElement('b'); b.textContent=fmt(sec);
    var btn=document.createElement('button'); btn.textContent='Start';
    var iv=null, left=sec;
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      if(iv){clearInterval(iv);iv=null;left=sec;b.textContent=fmt(left);btn.textContent='Start';return;}
      btn.textContent='Reset';
      iv=setInterval(function(){left--;b.textContent=fmt(left);
        if(left<=0){clearInterval(iv);iv=null;b.textContent='Time!';left=sec;btn.textContent='Start';}},1000);
    });
    li.append(b,btn);
  }
  function renderItem(it){
    var li = document.createElement('li');
    if (typeof it === 'string') li.textContent = it;
    else if (it.lead){ li.textContent = it.lead; li.className='lead'; }
    else if (it.vinyl){
      li.className='vinyl';
      var v=document.createElement('a'); v.href=it.vinyl; v.target='_blank'; v.rel='noopener noreferrer'; v.setAttribute('aria-label','Play the song on YouTube');
      v.innerHTML='<div class="disc"><b>♥</b></div><span>Tap the record to play</span>';
      v.addEventListener('click',function(e){e.stopPropagation();}); li.appendChild(v);
    }
    else if (it.link){
      var a=document.createElement('a'); a.className='play'; a.href=it.link; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent='▶ '+it.label; a.addEventListener('click',function(e){e.stopPropagation();}); li.appendChild(a);
    }
    else if (it.timer) timerRow(it.timer, li, it.text);
    return li;
  }
  function update(){
    for (var i=0;i<hearts.children.length;i++) hearts.children[i].className = i<shown ? 'on' : '';
    reset.hidden = shown===0;
    card.setAttribute('aria-label', t.title + ', ' + shown + ' of ' + t.items.length + ' revealed');
  }
  function next(){
    if (shown >= t.items.length) return;
    ul.appendChild(renderItem(t.items[shown])); shown++; update();
  }
  card.addEventListener('click', next);
  card.addEventListener('keydown', function(e){
    if (e.target===card && (e.key==='Enter'||e.key===' ')){e.preventDefault();next();}
  });
  reset.addEventListener('click', function(e){e.stopPropagation();ul.innerHTML='';shown=0;update();});
  update();
});
